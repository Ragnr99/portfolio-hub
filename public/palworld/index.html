<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palworld Interactive Map</title>
    <script type="module" crossorigin src="./assets/index-CNwcL2hj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-gmPwxNd4.css">
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Palpagos Map</h1>

        <input id="search" type="search" placeholder="Search markers (name)…" autocomplete="off" />

        <section class="panel">
          <div class="panel-title">Pal Spawns</div>
          <input id="pal-search" type="search" list="pal-list" placeholder="Pick a Pal…" autocomplete="off" />
          <datalist id="pal-list"></datalist>
          <div class="spawn-opts">
            <label><input type="checkbox" id="spawn-day" checked /> <span class="dot day"></span> Day</label>
            <label><input type="checkbox" id="spawn-night" checked /> <span class="dot night"></span> Night</label>
            <button id="spawn-clear" class="mini">clear</button>
          </div>
          <div id="spawn-status" class="hint"></div>
        </section>

        <section class="panel">
          <div class="panel-title">Region</div>
          <div class="seg" id="region-seg">
            <button data-region="all" class="on">All</button>
            <button data-region="base">Base</button>
            <button data-region="dlc">DLC</button>
          </div>
        </section>

        <div class="panel-title">Layers</div>
        <div id="layer-controls"></div>

        <div id="coord-readout">Hover the map for coords</div>
      </aside>
      <div id="map"></div>
    </div>
  </body>
</html>
